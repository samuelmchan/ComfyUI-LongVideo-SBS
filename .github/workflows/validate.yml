name: validate

on:
  push:
  pull_request:

jobs:
  syntax-and-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q .
      - name: Validate production workflow
        run: python scripts/validate_workflow.py
